data:
  processed_dir: "../../CSDI/ESA_mission1/data/processed"
  window_length: 96
  stride: 48
  channel_count: 76

graph:
  candidate_path: "../spatial_graph/phase1_results/candidate_graphs_top8.npz"
  artifact_path: "artifacts/mission1_diff_pearson_top8.npz"
  top_k: 8

frequency:
  output_dim: 32
  n_fft: 64
  hop_length: 16
  min_coverage: 0.1

train:
  seed: 1
  device: "cuda:0"
  steps: 32000
  batch_size: 16
  lr: 1.0e-3
  gradient_clip_norm: 1.0
  sanitize_nonfinite_gradients: true
  lr_milestones: [24000, 28800]
  checkpoint_interval: 3200
  log_interval: 1
  output_dir: "results/mission1_enhanced_seed1/training"

evaluation:
  protocol_manifest: "../../CSDI/ESA_mission1_structured/results/mission1_structured_only_seed1/evaluation/protocols/manifest.json"
  light_random_protocol_manifest: "results/mission1_light_random_baseline_seed1/evaluation/protocols/manifest.json"
  output_dir: "results/mission1_enhanced_seed1/evaluation"
  batch_size: 8
  nsample: 50
  sample_chunk_size: 5
  quantiles: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]

structured_mask:
  family_probabilities:
    time_block: 0.3333333333333333
    channel_dropout: 0.3333333333333333
    rectangle: 0.3333333333333334
  min_ratio: 0.1
  max_ratio: 0.9

diffusion:
  layers: 4
  channels: 64
  nheads: 8
  diffusion_embedding_dim: 128
  beta_start: 0.0001
  beta_end: 0.5
  num_steps: 50
  schedule: "quad"
  is_linear: false
  graph_bias_scale: 2.0
  frequency_scale: 1.0

model:
  is_unconditional: false
  timeemb: 128
  featureemb: 16
  target_strategy: "structured_only"
